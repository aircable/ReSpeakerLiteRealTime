substitutions:
  name: thinking-companion
  friendly_name: Thinking Companion

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.0
  project:
    name: aircable.respeaker-thinking-companion
    version: 0.1.0
  on_boot:
    - priority: -100
      then:
        - micro_wake_word.start
        - if:
            condition:
              lambda: return id(hardware_mute_state).state;
            then:
              - switch.turn_on: mute_toggle
  on_shutdown:
    then:
      - lambda: id(respeaker).mute_speaker();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: DEBUG
  logs:
    realtime_companion: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [realtime_companion]
  # Known-good hardware integration revisions; update only after hardware regression testing.
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: f8f41eeac4381c1c5ef8feaa8de4cedc25d0898f
    components: [i2s_audio]
    refresh: 30d
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration
      ref: 3136cf79238184e06bdf11e9b2105c58a16f6714
    components: [respeaker_lite]
    refresh: 30d

i2c:
  id: internal_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz

audio_dac:
  - platform: aic3204
    id: codec
    i2c_id: internal_i2c

i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin: {number: GPIO7, allow_other_uses: true}
    i2s_bclk_pin: {number: GPIO8, allow_other_uses: true}
    i2s_mclk_pin: {number: GPIO9, allow_other_uses: true}
  - id: i2s_output
    i2s_lrclk_pin: {number: GPIO7, allow_other_uses: true}
    i2s_bclk_pin: {number: GPIO8, allow_other_uses: true}
    i2s_mclk_pin: {number: GPIO9, allow_other_uses: true}

microphone:
  - platform: i2s_audio
    id: xmos_microphones
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    channel: stereo

speaker:
  - platform: i2s_audio
    id: xmos_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO43
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: codec
  - platform: resampler
    id: realtime_resampler
    output_speaker: xmos_speaker
    sample_rate: 48000
    bits_per_sample: 32
    buffer_duration: 100ms
    filters: 16
    taps: 32

respeaker_lite:
  id: respeaker
  reset_pin: GPIO2
  mute_state:
    id: hardware_mute_state
    internal: true
    on_state:
      - lambda: id(realtime).set_muted(x);
  firmware_version:
    id: xmos_firmware_version
    internal: true
  firmware:
    url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration/raw/3136cf79238184e06bdf11e9b2105c58a16f6714/respeaker_lite_i2s_dfu_firmware_48k_v1.1.0.bin
    version: "1.1.0"
    md5: 9297155d1bf3eb21a9d4db52a89ea0c6

realtime_companion:
  id: realtime
  microphone: xmos_microphones
  speaker: realtime_resampler
  url: !secret gateway_ws_url
  token: !secret device_token
  device_id: ${name}

switch:
  # A 300 ms pulse toggles the XMOS hardware mute latch (USR/MUTE jumper required).
  - platform: gpio
    id: mute_toggle
    internal: true
    pin: {number: GPIO4, inverted: true}
    on_turn_on:
      - delay: 300ms
      - switch.turn_off: mute_toggle

binary_sensor:
  - platform: gpio
    id: user_button
    internal: true
    pin: {number: GPIO3, inverted: true}
    filters: [delayed_on: 50ms, delayed_off: 50ms]
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - lambda: id(realtime).toggle_session();

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    rmt_symbols: 192
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Fast Pulse"
          update_interval: 10ms
          lambda: |-
            static float fraction = 0.0f;
            static float step = 0.05f;
            static bool increasing = true;
            const auto &values = id(status_led).current_values;
            const Color color(values.get_red() * 255, values.get_green() * 255,
                              values.get_blue() * 255);
            it[0].set_rgb(color.red * fraction, color.green * fraction, color.blue * fraction);
            fraction += step * (increasing ? 1.0f : -1.0f);
            if (fraction > 1.0f) {
              fraction = 1.0f;
              increasing = false;
            } else if (fraction < 0.0f) {
              fraction = 0.0f;
              increasing = true;
            }
      - addressable_lambda:
          name: "Slow Pulse"
          update_interval: 30ms
          lambda: |-
            static float fraction = 0.0f;
            static float step = 0.05f;
            static bool increasing = true;
            const auto &values = id(status_led).current_values;
            const Color color(values.get_red() * 255, values.get_green() * 255,
                              values.get_blue() * 255);
            it[0].set_rgb(color.red * fraction, color.green * fraction, color.blue * fraction);
            fraction += step * (increasing ? 1.0f : -1.0f);
            if (fraction > 1.0f) {
              fraction = 1.0f;
              increasing = false;
            } else if (fraction < 0.0f) {
              fraction = 0.0f;
              increasing = true;
            }

interval:
  - interval: 100ms
    then:
      - lambda: |-
          using esphome::realtime_companion::CompanionState;
          enum LedMode : uint8_t {
            INIT_SLOW, INIT_FAST, NO_GATEWAY, IDLE, MUTED, LISTENING, THINKING,
            SPEAKING, ERROR, BUTTON_PRESSED
          };

          LedMode mode;
          const bool initializing = !id(realtime).has_authenticated_once() && millis() < 600000;
          if (initializing) {
            mode = id(realtime).is_network_ready() ? INIT_FAST : INIT_SLOW;
          } else if (!id(realtime).is_network_ready() || !id(realtime).is_authenticated()) {
            mode = NO_GATEWAY;
          } else if (id(user_button).state) {
            mode = BUTTON_PRESSED;
          } else {
            switch (id(realtime).get_state()) {
              case CompanionState::CONNECTING:
              case CompanionState::LISTENING: mode = LISTENING; break;
              case CompanionState::THINKING: mode = THINKING; break;
              case CompanionState::SPEAKING: mode = SPEAKING; break;
              case CompanionState::ERROR: mode = ERROR; break;
              case CompanionState::IDLE: mode = IDLE; break;
              case CompanionState::MUTED: mode = MUTED; break;
            }
          }

          static uint8_t previous = 0xFF;
          if (previous == mode)
            return;
          previous = mode;

          if (mode == MUTED) {
            id(status_led).turn_off().perform();
            return;
          }
          auto call = id(status_led).turn_on();
          call.set_brightness(1.0f);
          switch (mode) {
            case INIT_SLOW:
              call.set_rgb(0.09f, 0.73f, 0.95f);
              call.set_effect("Slow Pulse");
              break;
            case INIT_FAST:
              call.set_rgb(0.09f, 0.73f, 0.95f);
              call.set_effect("Fast Pulse");
              break;
            case NO_GATEWAY:
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.set_effect("Slow Pulse");
              break;
            case LISTENING:
              call.set_rgb(1.0f, 0.2f, 1.0f);
              call.set_effect("Slow Pulse");
              break;
            case THINKING:
              call.set_rgb(1.0f, 0.2f, 1.0f);
              call.set_effect("Fast Pulse");
              break;
            case SPEAKING:
              call.set_rgb(0.2f, 1.0f, 1.0f);
              call.set_effect("Slow Pulse");
              break;
            case ERROR:
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.set_effect("Fast Pulse");
              break;
            case BUTTON_PRESSED:
              call.set_rgb(0.0f, 0.0f, 1.0f);
              call.set_effect("None");
              break;
            case IDLE:
              call.set_rgb(0.0f, 1.0f, 0.0f);
              call.set_effect("None");
              break;
            case MUTED: break;
          }
          call.perform();

micro_wake_word:
  id: wake_word
  microphone:
    microphone: xmos_microphones
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: hey_jarvis
  vad:
    probability_cutoff: 0.05
  on_wake_word_detected:
    - if:
        condition:
          lambda: return !id(hardware_mute_state).state;
        then:
          - lambda: id(realtime).start_session();
