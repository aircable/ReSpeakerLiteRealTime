# FFVA/ReSpeaker live image with the XMOS generating MCLK, BCLK, and LRCLK.
# Load only with the tested FFVA XMOS-clock-master image.
packages:
  base: !include respeaker-thinking-companion-ffva-base.yaml

substitutions:
  friendly_name: Thinking Companion FFVA Clock Master

esphome:
  build_path: .esphome/build-ffva-master
  project:
    name: aircable.respeaker-thinking-companion-ffva-master
    version: 1.0.0

realtime_companion:
  audio_stats_interval_ms: 5000
