# First stock XVF3610-INT experiment. Flash this to the ESP32-S3 over USB and
# inspect serial logs. It only reads XVF controls and captures the microphone.
# It does not touch XMOS flash, the AIC3204 codec, or the gateway.
esphome:
  name: thinking-companion-xvf-diag
  friendly_name: Thinking Companion XVF Diagnostic
  min_version: 2026.6.0
  project:
    name: aircable.respeaker-xvf3610-diagnostic
    version: 0.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG
  logs:
    xvf3610_diag: INFO

external_components:
  - source:
      type: local
      path: components
    components: [xvf3610_diag]
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: f8f41eeac4381c1c5ef8feaa8de4cedc25d0898f
    components: [i2s_audio]
    refresh: 30d

i2c:
  id: internal_i2c
  sda: GPIO5
  scl: GPIO6
  frequency: 100kHz

i2s_audio:
  - id: xmos_i2s
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8
    i2s_mclk_pin: GPIO9

microphone:
  - platform: i2s_audio
    id: xmos_microphones
    i2s_audio_id: xmos_i2s
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: primary
    channel: stereo

xvf3610_diag:
  id: xvf_diag
  i2c_id: internal_i2c
  address: 0x2C
  microphone: xmos_microphones
