<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thinking Companion</title>
  <style>
    :root{color-scheme:dark;--bg:#10141c;--panel:#19202c;--ink:#eaf0f6;--muted:#9aabba;--accent:#66d9bf}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
    main{max-width:1100px;margin:auto;padding:2rem}.bar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
    h1{font-size:1.6rem;margin-right:auto}.panel{background:var(--panel);border-radius:12px;padding:1.2rem;margin:1rem 0}
    input,textarea,select,button{font:inherit;border:1px solid #3a4657;border-radius:7px;padding:.65rem;background:#111722;color:var(--ink)}
    textarea{width:100%;min-height:90px;resize:vertical}#plan{min-height:330px}button{cursor:pointer}button.primary{background:var(--accent);color:#07130f;border:0}
    label{display:block;color:var(--muted);margin:.8rem 0 .3rem}.projects button{margin:.2rem}.active{outline:2px solid var(--accent)}
    .status{color:var(--muted)}@media(max-width:650px){main{padding:1rem}}
    #transcript{white-space:pre-wrap;max-height:260px;overflow:auto}
  </style>
</head>
<body><main>
  <div class="bar"><h1>Thinking Companion</h1><span id="status" class="status">Enter UI token</span><button onclick="setToken()">Token</button></div>
  <section class="panel"><div class="bar projects" id="projects"></div><div class="bar"><input id="newName" placeholder="New project"><button onclick="createProject()">Create</button></div></section>
  <section class="panel"><div class="bar"><strong>Voice settings</strong><input id="rtModel" placeholder="Realtime model"><input id="voice" placeholder="Voice"><select id="effort"><option>low</option><option>medium</option><option>high</option></select><input id="idle" type="number" min="5" max="900" title="Idle seconds"><label><input id="bargeIn" type="checkbox"> spoken barge-in</label><label><input id="openaiTrace" type="checkbox"> OpenAI trace</label><label><input id="diagnostic" type="checkbox"> diagnostic audio</label><button onclick="saveSettings()">Save</button></div></section>
  <section class="panel" id="editor" hidden>
    <label>Name</label><input id="name">
    <label>Goal</label><textarea id="goal"></textarea>
    <label>Project instructions</label><textarea id="instructions"></textarea>
    <label>Pinned notes</label><textarea id="notes"></textarea>
    <label>Rolling summary</label><textarea id="summary"></textarea>
    <label>Markdown plan</label><textarea id="plan"></textarea>
    <div class="bar"><button class="primary" onclick="save()">Save</button><button onclick="activate()">Make active</button><button onclick="showHistory()">Plan history</button><button onclick="exportPlan()">Export Markdown</button><span id="saved" class="status"></span></div><pre id="history" class="status"></pre>
  </section>
  <section class="panel"><div class="bar"><strong>Live device</strong><span id="deviceState" class="status">offline</span></div><div id="transcript" class="status">No transcript yet.</div></section>
</main><script>
let token=localStorage.uiToken||'', current=null, all=[], live=null;
function setToken(){token=prompt('UI token',token)||'';localStorage.uiToken=token;load();connectLive()}
async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:`Bearer ${token}`,'Content-Type':'application/json'};const r=await fetch(path,options);if(!r.ok)throw Error(await r.text());return r}
async function load(){try{all=await (await api('/api/projects')).json();const s=await (await api('/api/settings')).json();rtModel.value=s.realtime_model;voice.value=s.voice;effort.value=s.reasoning_effort;idle.value=s.idle_timeout_seconds;bargeIn.checked=s.barge_in_enabled;openaiTrace.checked=s.openai_trace;diagnostic.checked=s.diagnostic_audio;status.textContent='Gateway connected';projects.innerHTML='';all.forEach(p=>{const b=document.createElement('button');b.textContent=p.name+(p.active?' ●':'');b.className=p.active?'active':'';b.onclick=()=>select(p.id);projects.append(b)});if(current)select(current)}catch(e){status.textContent='Authentication required'}}
async function select(id){current=id;const p=await (await api(`/api/projects/${id}`)).json();editor.hidden=false;name.value=p.name;goal.value=p.goal;instructions.value=p.instructions;notes.value=p.pinned_notes;summary.value=p.summary;plan.value=p.plan_markdown;const turns=await (await api(`/api/projects/${id}/turns`)).json();transcript.textContent=turns.map(t=>`${t.role}: ${t.text}`).join('\n')||'No transcript yet.'}
async function save(){await api(`/api/projects/${current}`,{method:'PATCH',body:JSON.stringify({name:name.value,goal:goal.value,instructions:instructions.value,pinned_notes:notes.value,summary:summary.value,plan_markdown:plan.value})});saved.textContent='Saved';setTimeout(()=>saved.textContent='',1500);load()}
async function activate(){await api(`/api/projects/${current}/activate`,{method:'POST'});load()}
async function createProject(){if(!newName.value)return;const p=await (await api('/api/projects',{method:'POST',body:JSON.stringify({name:newName.value})})).json();newName.value='';await load();select(p.id)}
function exportPlan(){window.open(`/api/projects/${current}/export.md?token=${encodeURIComponent(token)}`)}
async function saveSettings(){await api('/api/settings',{method:'PATCH',body:JSON.stringify({realtime_model:rtModel.value,voice:voice.value,reasoning_effort:effort.value,idle_timeout_seconds:Number(idle.value),barge_in_enabled:bargeIn.checked,openai_trace:openaiTrace.checked,diagnostic_audio:diagnostic.checked})});status.textContent='Settings apply to the next voice session'}
async function showHistory(){const h=await (await api(`/api/projects/${current}/history`)).json();history.textContent=h.map(x=>`${x.created_at}\n${x.plan_markdown}`).join('\n\n')||'No automatic revisions yet.'}
function connectLive(){if(live)live.close();const scheme=location.protocol==='https:'?'wss':'ws';live=new WebSocket(`${scheme}://${location.host}/ws/ui?token=${encodeURIComponent(token)}`);live.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state')deviceState.textContent=`${m.device_id}: ${m.state}`;if(m.type==='transcript.delta'){if(transcript.textContent==='No transcript yet.')transcript.textContent='';transcript.textContent+=m.text;transcript.scrollTop=transcript.scrollHeight}if(m.type==='session.ended'&&current)select(current)};live.onclose=()=>deviceState.textContent='offline'}
if(token){load();connectLive()}else setToken();
</script></body></html>
